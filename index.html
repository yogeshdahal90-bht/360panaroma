<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload 360° Panorama Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* UI Control Panel */
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #ffffff;
            background: rgba(20, 20, 20, 0.75);
            padding: 18px 22px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 320px;
        }
        .ui-overlay h1 {
            font-size: 1.2rem;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .ui-overlay p {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 14px;
            line-height: 1.3;
        }

        /* Upload Button Styles */
        .upload-btn {
            display: block;
            width: 100%;
            padding: 10px 14px;
            background: #3b82f6;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .upload-btn:hover {
            background: #2563eb;
        }
        .upload-btn:active {
            transform: scale(0.98);
        }
        #file-input {
            display: none;
        }

        /* Loading Indicator */
        #status-msg {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #10b981;
            display: none;
        }
    </style>
    <!-- Import Three.js & OrbitControls via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div class="ui-overlay">
        <h1>360° Panorama Viewer</h1>
        <p>Drag to look around | Scroll to zoom</p>
        
        <!-- File Input Interface -->
        <label for="file-input" class="upload-btn">📁 Load 360° Image</label>
        <input type="file" id="file-input" accept="image/*">
        
        <div id="status-msg">Panorama loaded!</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene, Camera, and Renderer Setup
        const container = document.getElementById('canvas-container');
        const fileInput = document.getElementById('file-input');
        const statusMsg = document.getElementById('status-msg');

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight, 
            0.1, 
            1000
        );
        camera.position.set(0, 0, 0.1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // 2. Add Orbit Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.rotateSpeed = -0.5; // Natural control direction
        controls.minDistance = 0.1;
        controls.maxDistance = 10;

        // 3. Create the Inverted Sphere Geometry
        const geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1); // Flip inside out

        const material = new THREE.MeshBasicMaterial();
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        const textureLoader = new THREE.TextureLoader();

        // Load Default Sample Image First
        const defaultUrl = 'https://threejs.org/examples/textures/22944123048_42520c3b9f_k.jpg';
        loadPanorama(defaultUrl);

        // 4. Function to apply texture to sphere
        function loadPanorama(imageSource) {
            textureLoader.load(imageSource, (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;
                
                // Dispose old texture memory if present
                if (material.map) material.map.dispose();

                material.map = texture;
                material.needsUpdate = true;
                
                statusMsg.style.display = 'block';
                statusMsg.textContent = '✓ Panorama updated';
                setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
            });
        }

        // 5. User File Upload Handler (FileReader API)
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    loadPanorama(event.target.result); // Pass Base64 data URL to Three.js
                };
                reader.readAsDataURL(file);
            }
        });

        // 6. Drag & Drop Files directly onto the screen
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                const file = e.dataTransfer.files[0];
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        loadPanorama(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 8. Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
